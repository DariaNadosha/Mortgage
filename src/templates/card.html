<div class="card">
    <div class="card__video">
        <img
            src="/src/img/justin.png"
            alt="justin"
        />
        <div class="card__video-play">
            <a class="btn-play btn-play--blue">
                <svg
                    width="11"
                    height="16"
                    viewBox="0 0 11 16"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M11 8L0 16V0L11 8Z"
                        fill="white"
                    />
                </svg>
            </a>
            <p class="card__video-timing">Meet Justin</p>
        </div>
    </div>
    <div class="card__info">
        <div class="card__profession">The master mind</div>
        <div class="card__name">Justin</div>
        <hr class="card__divider-short" />
        <div class="card__text">
            Rates change, but every mortgage journey starts with a relationship.
            (Pssst...it’s not just about clicking a button)
        </div>
        <h3 class="card__skills">Skills</h3>
        <hr class="card__divider" />
        <div class="card__items">
            <div class="card__item">
                <div class="card__item-circle">
                    <img
                        src="/src/img/skills/deals.svg"
                        alt="briefcase"
                        class="card__item-icon"
                    />
                </div>
                <div class="card__item-title">Deals</div>
            </div>
            <div class="card__item">
                <div class="card__item-circle">
                    <img
                        src="/src/img/skills/compass.svg"
                        alt="compass"
                        class="card__item-icon"
                    />
                </div>

                <div class="card__item-title">Find the right way</div>
            </div>
            <div class="card__item">
                <div class="card__item-circle">
                    <img
                        src="/src/img/skills/database.svg"
                        alt="database"
                        class="card__item-icon"
                    />
                </div>

                <div class="card__item-title">Mortgage «database»</div>
            </div>
            <div class="card__item">
                <div class="card__item-circle">
                    <img
                        src="/src/img/skills/document.svg"
                        alt="document"
                        class="card__item-icon"
                    />
                </div>
                <div class="card__item-title">Docs master</div>
            </div>
        </div>
    </div>
</div>
